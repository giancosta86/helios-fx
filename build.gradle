buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'scala'
apply plugin: 'maven'
apply plugin: 'osgi'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.helios'
archivesBaseName = 'helios-fx'
version = '7.0.0-SNAPSHOT'


description = 'Library of ScalaFX utilities'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'
    compile 'org.scalafx:scalafx_2.11:8.0.92-R10'

    compile 'info.gianlucacosta.helios:helios-core:7.0.0-SNAPSHOT'
}



aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}